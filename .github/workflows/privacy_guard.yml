name: Privacy Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-files-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan only newly changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            python tools/privacy_guard.py \
              --base "${PR_BASE_SHA}" \
              --head "${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" \
              && -n "${EVENT_BEFORE}" \
              && ! "${EVENT_BEFORE}" =~ ^0+$ ]]; then
            python tools/privacy_guard.py \
              --base "${EVENT_BEFORE}" \
              --head "${CURRENT_SHA}"
          else
            python tools/privacy_guard.py --commit "${CURRENT_SHA}"
          fi
